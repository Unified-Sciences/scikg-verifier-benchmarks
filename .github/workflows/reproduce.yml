name: Reproduce benchmark results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify immutable artifacts and scores
        run: python verify_release.py
      - name: Compile public clients
        run: python -m py_compile benchmarks/matbench_v0.1_SciKG_Verify/submission_client.py tdc_pgp/submission_client.py
